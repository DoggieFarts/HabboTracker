name: Prueba de tamaño de lote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recolectar          # nunca corre al mismo tiempo que el recolector
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer los datos guardados
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          mkdir -p sitio
          timeout 60 git fetch --quiet --depth 1 origin datos
          git archive FETCH_HEAD | tar -x -C sitio

      - name: Probar lotes de 20, 50, 100 y 200
        run: python -u prueba_lote.py --sitio sitio
