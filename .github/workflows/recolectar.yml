name: Recolectar precios

on:
  schedule:
    # 07:00 y 19:00 hora CDMX = 13:00 y 01:00 UTC
    - cron: "0 13 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      completo:
        description: "Revisar todo el catálogo ahora (tarda más)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer los datos guardados
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          mkdir -p sitio
          if timeout 60 git fetch --quiet --depth 1 origin datos 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C sitio
            echo "Datos anteriores recuperados."
          else
            echo "Primera corrida: todavía no hay datos guardados."
          fi

      - name: Consultar el Mercadillo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u recolector.py --sitio sitio ${{ inputs.completo && '--completo' || '' }}

      - name: Traer historial de 2 años (habboapi.site)
        continue-on-error: true   # si habboapi.site falla, la página se publica igual
        timeout-minutes: 35
        run: |
          HOTELS=$(python - <<'PY'
import json
from pathlib import Path
cfg = json.loads(Path('avisos.json').read_text(encoding='utf-8'))
hotels = cfg.get('hoteles') or ([cfg.get('hotel')] if cfg.get('hotel') else ['habbo.es'])
print(' '.join(h for h in hotels if h))
PY
          )
          i=0
          for hotel in $HOTELS; do
            sitio_dir="sitio"
            if [ "$i" -gt 0 ]; then
              sitio_dir="sitio/$hotel"
            fi
            python -u historial.py --sitio "$sitio_dir" --minutos 30
            i=$((i + 1))
          done

      - name: Calcular el radar
        continue-on-error: true   # si falla, la página se publica igual
        timeout-minutes: 10
        run: |
          pip install --quiet numpy
          HOTELS=$(python - <<'PY'
import json
from pathlib import Path
cfg = json.loads(Path('avisos.json').read_text(encoding='utf-8'))
hotels = cfg.get('hoteles') or ([cfg.get('hotel')] if cfg.get('hotel') else ['habbo.es'])
print(' '.join(h for h in hotels if h))
PY
          )
          i=0
          for hotel in $HOTELS; do
            sitio_dir="sitio"
            if [ "$i" -gt 0 ]; then
              sitio_dir="sitio/$hotel"
            fi
            python -u prediccion.py --sitio "$sitio_dir"
            i=$((i + 1))
          done

      - name: Publicar la página
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash publicar.sh "Datos del $(date -u '+%F %H:%M') UTC"
