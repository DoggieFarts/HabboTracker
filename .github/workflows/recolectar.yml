name: Recolectar precios

on:
  schedule:
    - cron: "0 13 * * *"   # todos los días, 7:00 a. m. hora del centro de México
  workflow_dispatch:
    inputs:
      completo:
        description: "Revisar todo el catálogo ahora (tarda más)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: recolectar
  cancel-in-progress: false

jobs:
  recolectar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Traer los datos guardados
        timeout-minutes: 3
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          mkdir -p sitio
          if timeout 60 git fetch --quiet --depth 1 origin datos 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C sitio
            echo "Datos anteriores recuperados."
          else
            echo "Primera corrida: todavía no hay datos guardados."
          fi

      - name: Consultar el Mercadillo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u recolector.py --sitio sitio ${{ inputs.completo && '--completo' || '' }}

      - name: Traer historial de 2 años (habboapi.site)
        continue-on-error: true   # si habboapi.site falla, la página se publica igual
        timeout-minutes: 35
        run: python -u historial.py --sitio sitio --minutos 30

      - name: Publicar la página
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html sitio/index.html
          cd sitio
          git init --quiet -b datos
          git config user.name "mercadillo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Datos del $(date -u +%F)"
          # la rama datos siempre tiene un solo commit, así el repo no crece cada día
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
